<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Record Expense - Qurtaba School of Excellence Bela</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3525cd",
                        "on-primary": "#ffffff",
                        "surface": "#fcf8ff",
                        "surface-container": "#f0ecf9",
                        "surface-container-low": "#f5f2ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#eae6f4",
                        "on-surface": "#1b1b24",
                        "on-surface-variant": "#464555",
                        "background": "#fcf8ff",
                        "outline": "#777587",
                        "outline-variant": "#c7c4d8",
                        "error": "#ba1a1a"
                    },
                    fontFamily: {
                        headline: ["Inter"],
                        body: ["Inter"]
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="shared.css"/>
</head>
<body class="bg-background font-body flex min-h-screen">
    <div id="sidebar-overlay"></div>
    <aside id="sidebar" class="w-[280px] bg-surface-container-lowest border-r border-outline-variant/20 flex flex-col h-screen sticky top-0 shrink-0 hidden md:flex z-40 overflow-y-auto"></aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header id="topbar" data-title="Record Expense" class="h-16 bg-surface border-b border-outline-variant/20 shadow-sm flex items-center justify-between px-6 sticky top-0 z-30 shrink-0"></header>
        
        <main class="flex-1 p-6 lg:p-8 overflow-y-auto bg-background">
            <div class="max-w-4xl mx-auto">
                <!-- Breadcrumbs -->
                <nav class="flex items-center gap-2 text-sm text-on-surface-variant mb-6">
                    <a href="dashboard.html" class="hover:text-primary transition-colors">Dashboard</a>
                    <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                    <a href="accounting.html" class="hover:text-primary transition-colors">Accounting</a>
                    <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                    <span class="text-on-surface font-semibold">Record Expense</span>
                </nav>

                <div class="flex items-center justify-between mb-8">
                    <div>
                        <h2 class="text-2xl font-headline font-bold text-on-surface">Record New Expense</h2>
                        <p class="text-on-surface-variant mt-1 text-sm">Enter the details of the expenditure for accounting purposes.</p>
                    </div>
                </div>

                <div class="card p-8">
                    <form id="recordExpenseForm" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- Expense Title -->
                            <div class="md:col-span-2 space-y-2">
                                <label class="text-sm font-bold text-on-surface">Expense Title <span class="text-error">*</span></label>
                                <input type="text" name="title" placeholder="e.g. Monthly Electricity Bill - October" class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" required/>
                            </div>

                            <!-- Category -->
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-on-surface">Category <span class="text-error">*</span></label>
                                <select name="category" class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" required>
                                    <option value="" disabled selected>Select Category</option>
                                    <option>Utilities (Electricity, Water, Gas)</option>
                                    <option>Staff Payroll</option>
                                    <option>Maintenance & Repairs</option>
                                    <option>Stationery & Office Supplies</option>
                                    <option>Educational Resources</option>
                                    <option>Marketing & Advertising</option>
                                    <option>Miscellaneous</option>
                                </select>
                            </div>

                            <!-- Amount -->
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-on-surface">Amount (₨) <span class="text-error">*</span></label>
                                <input type="number" name="amount" placeholder="0.00" class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" required/>
                            </div>

                            <!-- Date -->
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-on-surface">Date <span class="text-error">*</span></label>
                                <input type="date" name="date" class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" required/>
                            </div>

                            <!-- Description -->
                            <div class="md:col-span-2 space-y-2">
                                <label class="text-sm font-bold text-on-surface">Description</label>
                                <textarea name="description" rows="3" placeholder="Additional details about the expense..." class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all resize-none"></textarea>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="flex items-center justify-end gap-4 pt-6 border-t border-outline-variant/20">
                            <button type="button" class="btn-secondary px-8" onclick="window.location='accounting.html'">Cancel</button>
                            <button type="submit" class="btn-primary px-8">Save Expense</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="shared.js"></script>
    <script>
        document.getElementById('recordExpenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.amount = Number(data.amount);
            
            try {
                const res = await fetch('/api/expenses', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (res.ok) {
                    alert('Expense recorded successfully!');
                    window.location.href = 'accounting.html';
                } else {
                    alert('Error saving expense');
                }
            } catch (error) {
                console.error(error);
                alert('Error saving expense');
            }
        });
    </script>
</body>
</html>
