<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Add Program - Qurtaba School of Excellence Bela</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3525cd",
                        "on-primary": "#ffffff",
                        "surface": "#fcf8ff",
                        "surface-container": "#f0ecf9",
                        "surface-container-low": "#f5f2ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#eae6f4",
                        "on-surface": "#1b1b24",
                        "on-surface-variant": "#464555",
                        "background": "#fcf8ff",
                        "outline": "#777587",
                        "outline-variant": "#c7c4d8",
                        "error": "#ba1a1a"
                    },
                    fontFamily: {
                        headline: ["Inter"],
                        body: ["Inter"]
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="shared.css"/>
</head>
<body class="bg-background font-body flex min-h-screen">
    <div id="sidebar-overlay"></div>
    <aside id="sidebar" class="w-[280px] bg-surface-container-lowest border-r border-outline-variant/20 flex flex-col h-screen sticky top-0 shrink-0 hidden md:flex z-40 overflow-y-auto"></aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header id="topbar" data-title="Add Program" class="h-16 bg-surface border-b border-outline-variant/20 shadow-sm flex items-center justify-between px-6 sticky top-0 z-30 shrink-0"></header>
        
        <main class="flex-1 p-6 lg:p-8 overflow-y-auto bg-background">
            <div class="max-w-4xl mx-auto">
                <!-- Breadcrumbs -->
                <nav class="flex items-center gap-2 text-sm text-on-surface-variant mb-6">
                    <a href="dashboard.html" class="hover:text-primary transition-colors">Dashboard</a>
                    <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                    <a href="programs-list.html" class="hover:text-primary transition-colors">Programs</a>
                    <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                    <span class="text-on-surface font-semibold">Add Program</span>
                </nav>

                <div class="flex items-center justify-between mb-8">
                    <div>
                        <h2 class="text-2xl font-headline font-bold text-on-surface">Create New Program</h2>
                        <p class="text-on-surface-variant mt-1 text-sm">Add a new course or vocational program to the system.</p>
                    </div>
                </div>

                <div class="card p-8">
                    <form id="programForm" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- Program Name -->
                            <div class="md:col-span-2 space-y-2">
                                <label class="text-sm font-bold text-on-surface">Program Name <span class="text-error">*</span></label>
                                <input type="text" name="name" placeholder="e.g. Spoken English Mastery" class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" required/>
                            </div>

                            <!-- Description -->
                            <div class="md:col-span-2 space-y-2">
                                <label class="text-sm font-bold text-on-surface">Description <span class="text-error">*</span></label>
                                <textarea name="description" rows="4" placeholder="Brief overview of the program..." class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all resize-none" required></textarea>
                            </div>

                            <!-- Duration -->
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-on-surface">Duration <span class="text-error">*</span></label>
                                <input type="text" name="duration" placeholder="e.g. 3 Months" class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" required/>
                            </div>

                            <!-- Fee -->
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-on-surface">Fee (₨) <span class="text-error">*</span></label>
                                <input type="number" name="fee" placeholder="0.00" class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" required/>
                            </div>

                            <!-- Teacher -->
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-on-surface">Teacher / Instructor</label>
                                <input type="text" placeholder="e.g. Mr. Jawad" class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all"/>
                            </div>

                            <!-- Status -->
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-on-surface">Status</label>
                                <select class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all">
                                    <option>Active</option>
                                    <option>Inactive</option>
                                    <option>Upcoming</option>
                                </select>
                            </div>

                            <!-- Thumbnail Image -->
                            <div class="md:col-span-2 space-y-2">
                                <label class="text-sm font-bold text-on-surface">Thumbnail Image</label>
                                <div id="dropzone" class="border-2 border-dashed border-outline-variant/50 rounded-2xl p-8 flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container-high transition-colors cursor-pointer group">
                                     <span class="material-symbols-outlined text-[48px] text-outline group-hover:text-primary transition-colors">image</span>
                                     <p class="mt-2 text-sm text-on-surface-variant font-medium">Upload program image</p>
                                     <input type="file" id="thumb-input" class="hidden"/>
                                 </div>
                            </div>

                            <!-- Checkbox: Show on Public Page -->
                            <div class="md:col-span-2 flex items-center gap-3 p-4 bg-primary/5 rounded-xl border border-primary/10">
                                <input type="checkbox" id="show-public" class="w-5 h-5 rounded text-primary focus:ring-primary cursor-pointer"/>
                                <label for="show-public" class="text-sm font-medium text-on-surface cursor-pointer select-none">
                                    Show on Public Programs Page
                                    <span class="block text-xs text-on-surface-variant font-normal">If checked, this program will be visible on the public website.</span>
                                </label>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="flex items-center justify-end gap-4 pt-6 border-t border-outline-variant/20">
                            <button type="button" class="btn-secondary px-8" onclick="window.location='programs-list.html'">Cancel</button>
                            <button type="submit" class="btn-primary px-8">Save Program</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="shared.js"></script>
    <script>
        let isEditing = false;
        let editId = null;

        async function loadProgramData() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('edit')) {
                isEditing = true;
                editId = params.get('edit');
                document.querySelector('h2').textContent = 'Edit Program';
                document.querySelector('p.text-on-surface-variant').textContent = 'Update program or course details.';
                document.querySelector('button[type="submit"]').textContent = 'Update Program';

                try {
                    const res = await fetch(`/api/programs/${editId}`);
                    if (!res.ok) throw new Error('Program not found');
                    const p = await res.json();
                    
                    const form = document.getElementById('programForm');
                    form.elements['name'].value = p.name || '';
                    form.elements['description'].value = p.description || '';
                    form.elements['duration'].value = p.duration || '';
                    form.elements['fee'].value = p.fee || '';
                    
                    if (p.image) {
                        document.getElementById('dropzone').querySelector('p').textContent = 'Current Image Loaded';
                    }
                } catch(e) {
                    console.error(e);
                    alert('Error loading program data');
                }
            }
        }

        async function uploadFile(file) {
            if (!file) return null;
            return uploadOptimizedFile(file, 'program');
        }

        async function handleAddProgram(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = isEditing ? 'Updating...' : 'Saving...';

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            const file = document.getElementById('thumb-input').files[0];

            try {
                let imageUrl = null;
                if (file) {
                    imageUrl = await uploadFile(file);
                }
                const payload = {
                    name: data.name,
                    description: data.description,
                    duration: data.duration,
                    fee: parseFloat(data.fee)
                };
                if (imageUrl) {
                    payload.image = imageUrl;
                }

                const url = isEditing ? `/api/programs/${editId}` : '/api/programs';
                const method = isEditing ? 'PATCH' : 'POST';

                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert(isEditing ? 'Program updated successfully!' : 'Program added successfully!');
                    window.location.href = 'programs-list.html';
                } else {
                    const err = await res.json();
                    alert(err.message || 'Failed to save program');
                }
            } catch (e) {
                console.error(e);
                alert('Failed to save program');
            } finally {
                btn.disabled = false;
                btn.textContent = isEditing ? 'Update Program' : 'Save Program';
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await loadProgramData();
            document.getElementById('programForm').addEventListener('submit', handleAddProgram);
            
            // Image trigger
            const dropzone = document.getElementById('dropzone');
            const input = document.getElementById('thumb-input');
            dropzone.addEventListener('click', () => input.click());
            input.addEventListener('change', (e) => {
                if (e.target.files[0]) {
                    dropzone.querySelector('p').textContent = e.target.files[0].name;
                }
            });
        });
    </script>
