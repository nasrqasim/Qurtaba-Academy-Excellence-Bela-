<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Notifications - Qurtaba School of Excellence Bela</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3525cd",
                        "on-primary": "#ffffff",
                        "surface": "#fcf8ff",
                        "surface-container": "#f0ecf9",
                        "surface-container-low": "#f5f2ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#eae6f4",
                        "on-surface": "#1b1b24",
                        "on-surface-variant": "#464555",
                        "background": "#fcf8ff",
                        "outline": "#777587",
                        "outline-variant": "#c7c4d8",
                        "error": "#ba1a1a"
                    },
                    fontFamily: { headline: ["Inter"], body: ["Inter"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="shared.css"/>
</head>
<body class="bg-background font-body flex min-h-screen">
    <div id="sidebar-overlay"></div>
    <aside id="sidebar" class="w-[280px] bg-surface-container-lowest border-r border-outline-variant/20 flex flex-col h-screen sticky top-0 shrink-0 hidden md:flex z-40 overflow-y-auto"></aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header id="topbar" data-title="Notifications & Alerts" class="h-16 bg-surface border-b border-outline-variant/20 shadow-sm flex items-center justify-between px-6 sticky top-0 z-30 shrink-0"></header>
        
        <main class="flex-1 p-6 lg:p-8 overflow-y-auto bg-background">
            <div class="max-w-4xl mx-auto">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                    <div>
                        <h2 class="text-2xl font-headline font-bold text-on-surface">Announcements</h2>
                        <p class="text-on-surface-variant mt-1 text-sm">Send and manage system-wide alerts and notifications.</p>
                    </div>
                    <button class="btn-primary" onclick="window.location='add-notification.html'">
                        <span class="material-symbols-outlined text-[18px]">send</span>
                        New Announcement
                    </button>
                </div>

                <!-- Notifications List -->
                <div class="card overflow-hidden">
                    <div class="card-header flex justify-between items-center bg-surface-container-low/50">
                        <div class="flex gap-4">
                            <button class="text-sm font-bold text-primary border-b-2 border-primary pb-1">All</button>
                            <button class="text-sm font-medium text-on-surface-variant hover:text-on-surface pb-1 transition-colors">Unread</button>
                            <button class="text-sm font-medium text-on-surface-variant hover:text-on-surface pb-1 transition-colors">Sent</button>
                        </div>
                        <button class="text-xs font-bold text-primary hover:underline">Mark all as read</button>
                    </div>
                    <div class="divide-y divide-outline-variant/20">
                        <!-- Dynamically populated notifications will go here -->
                    </div>
                    <div class="card-header bg-surface-container-low/30 text-center py-3">
                        <button class="text-xs font-bold text-primary hover:underline">Load Older Notifications</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="shared.js"></script>
    <script>
        async function loadNotifications() {
            try {
                const res = await fetch('/api/notifications');
                const notifications = await res.json();
                renderNotifications(notifications);
            } catch (e) {
                console.error('Error loading notifications:', e);
            }
        }

        function renderNotifications(notifications) {
            const container = document.querySelector('.divide-y');
            container.innerHTML = notifications.map(notif => `
                <div class="p-5 flex gap-4 hover:bg-surface-container-low/30 transition-colors cursor-pointer group">
                    <div class="w-10 h-10 rounded-full ${getIconBg(notif.type)} flex items-center justify-center ${getIconColor(notif.type)} shrink-0">
                        <span class="material-symbols-outlined">${getIconName(notif.type)}</span>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between mb-1">
                            <h4 class="font-bold text-on-surface text-sm">${notif.title}</h4>
                            <span class="text-[10px] text-on-surface-variant font-medium">${formatDate(notif.createdAt)}</span>
                        </div>
                        <p class="text-sm text-on-surface-variant leading-relaxed">${notif.message}</p>
                        <div class="mt-3 flex gap-2">
                            <span class="px-2 py-0.5 bg-surface-container rounded text-[10px] font-bold text-on-surface-variant">${notif.targetGroup}</span>
                            ${notif.priority ? `<span class="px-2 py-0.5 bg-amber-50 text-amber-700 rounded text-[10px] font-bold">Priority</span>` : ''}
                        </div>
                    </div>
                    <div class="print:hidden">
                        <button onclick="deleteNotification('${notif._id}', event)" class="p-1.5 hover:bg-surface-container rounded text-rose-600 transition-colors" title="Delete Announcement">
                            <span class="material-symbols-outlined text-[18px]">delete</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function getIconBg(type) {
            if (type === 'Alert') return 'bg-amber-100';
            if (type === 'Fee') return 'bg-emerald-100';
            return 'bg-blue-100';
        }
        function getIconColor(type) {
            if (type === 'Alert') return 'text-amber-700';
            if (type === 'Fee') return 'text-emerald-700';
            return 'text-blue-700';
        }
        function getIconName(type) {
            if (type === 'Alert') return 'warning';
            if (type === 'Fee') return 'payments';
            return 'info';
        }

        function formatDate(date) {
            const d = new Date(date);
            const now = new Date();
            const diff = now - d;
            if (diff < 3600000) return Math.floor(diff / 60000) + ' mins ago';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' hours ago';
            return d.toLocaleDateString();
        }

        window.deleteNotification = async function(id, e) {
            e.stopPropagation();
            if (!confirm('Delete this notification?')) return;
            try {
                const res = await fetch(`/api/notifications/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadNotifications();
                } else {
                    alert('Failed to delete notification.');
                }
            } catch (e) {
                console.error(e);
                alert('An error occurred.');
            }
        }

        window.addEventListener('DOMContentLoaded', loadNotifications);
    </script>
