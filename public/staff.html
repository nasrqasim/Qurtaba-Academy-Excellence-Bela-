<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Staff Directory - Qurtaba School of Excellence Bela</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3525cd",
                        "on-primary": "#ffffff",
                        "surface": "#fcf8ff",
                        "surface-container": "#f0ecf9",
                        "surface-container-low": "#f5f2ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#eae6f4",
                        "on-surface": "#1b1b24",
                        "on-surface-variant": "#464555",
                        "background": "#fcf8ff",
                        "outline": "#777587",
                        "outline-variant": "#c7c4d8",
                        "error": "#ba1a1a"
                    },
                    fontFamily: { headline: ["Inter"], body: ["Inter"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="shared.css"/>
</head>
<body class="bg-background font-body flex min-h-screen">
    <div id="sidebar-overlay"></div>
    <aside id="sidebar" class="w-[280px] bg-surface-container-lowest border-r border-outline-variant/20 flex flex-col h-screen sticky top-0 shrink-0 hidden md:flex z-40 overflow-y-auto"></aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header id="topbar" data-title="Staff & Teachers" class="h-16 bg-surface border-b border-outline-variant/20 shadow-sm flex items-center justify-between px-6 sticky top-0 z-30 shrink-0"></header>
        
        <main class="flex-1 p-6 lg:p-8 overflow-y-auto bg-background">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                <div>
                    <h2 class="text-2xl font-headline font-bold text-on-surface">Staff Directory</h2>
                    <p class="text-on-surface-variant mt-1 text-sm">Manage academic and administrative personnel records.</p>
                </div>
                <div class="flex gap-3">
                    <button class="btn-secondary">
                        <span class="material-symbols-outlined text-[18px]">print</span>
                        Print Directory
                    </button>
                    <button class="btn-primary" onclick="window.location='staff-registration.html'">
                        <span class="material-symbols-outlined text-[18px]">person_add</span>
                        Add New Staff
                    </button>
                </div>
            </div>

            <!-- Filters -->
            <div class="card p-4 mb-6 flex flex-wrap gap-4">
                <div class="flex-1 min-w-[240px] relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">search</span>
                    <input type="text" placeholder="Search by name, department, or employee ID..." class="input-field pl-10"/>
                </div>
                <select class="input-field w-auto min-w-[160px]">
                    <option value="">All Departments</option>
                    <option>Mathematics</option>
                    <option>Science</option>
                    <option>Administration</option>
                    <option>Accounts</option>
                </select>
            </div>

            <!-- Staff Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" id="staff-grid">
                <!-- Data will be loaded dynamically -->
            </div>
        </main>
    </div>
    <script src="shared.js"></script>
    <script>
        async function loadStaff() {
            try {
                const res = await fetch('/api/staff');
                const staffList = await res.json();
                const grid = document.getElementById('staff-grid');
                
                grid.innerHTML = staffList.map(staff => {
                    const initials = staff.fullName.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
                    return `
                    <div class="card p-5 group">
                        <div class="flex items-start justify-between mb-4">
                            <div class="flex items-center gap-4">
                                <div class="w-16 h-16 rounded-2xl bg-primary/10 flex items-center justify-center text-primary font-black text-xl">${initials}</div>
                                <div>
                                    <h3 class="font-bold text-on-surface group-hover:text-primary transition-colors">${staff.fullName}</h3>
                                    <p class="text-xs text-on-surface-variant">${staff.designation} - ${staff.department}</p>
                                    <p class="text-[10px] font-bold text-primary mt-1 uppercase tracking-tighter">${staff.empId || 'N/A'}</p>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button class="p-1 hover:bg-surface-container rounded text-primary" title="Edit" onclick="editStaff('${staff._id}')"><span class="material-symbols-outlined text-[20px]">edit</span></button>
                                <button class="p-1 hover:bg-rose-50 rounded text-rose-600" title="Delete" onclick="deleteStaff('${staff._id}')"><span class="material-symbols-outlined text-[20px]">delete</span></button>
                            </div>
                        </div>
                        <div class="space-y-2 border-t border-outline-variant/10 pt-4">
                            <div class="flex items-center gap-2 text-xs text-on-surface-variant">
                                <span class="material-symbols-outlined text-[16px]">mail</span>
                                ${staff.email || 'N/A'}
                            </div>
                            <div class="flex items-center gap-2 text-xs text-on-surface-variant">
                                <span class="material-symbols-outlined text-[16px]">phone</span>
                                ${staff.phone || 'N/A'}
                            </div>
                        </div>
                        <div class="mt-5 flex gap-2">
                            <button class="flex-1 py-2 bg-surface-container-high rounded-lg text-xs font-bold hover:bg-primary hover:text-white transition-all">Profile</button>
                            <button class="flex-1 py-2 bg-surface-container-high rounded-lg text-xs font-bold hover:bg-primary hover:text-white transition-all">Payroll</button>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) {
                console.error('Error loading staff:', e);
            }
        }

        function editStaff(id) {
            window.location.href = `staff-registration.html?edit=${id}`;
        }

        async function deleteStaff(id) {
            if (!confirm('Are you sure you want to delete this staff member?')) return;
            try {
                const res = await fetch(`/api/staff/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadStaff();
                } else {
                    alert('Failed to delete staff');
                }
            } catch (e) {
                console.error(e);
                alert('An error occurred');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadStaff();
        });
    </script>
</body>
</html>
