<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Student Activities - Qurtaba Academy of Excellence Bela</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3525cd",
                        "on-primary": "#ffffff",
                        "surface": "#fcf8ff",
                        "surface-container": "#f0ecf9",
                        "surface-container-low": "#f5f2ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#eae6f4",
                        "on-surface": "#1b1b24",
                        "on-surface-variant": "#464555",
                        "background": "#fcf8ff",
                        "outline": "#777587",
                        "outline-variant": "#c7c4d8",
                        "error": "#ba1a1a"
                    },
                    fontFamily: {
                        headline: ["Inter"],
                        body: ["Inter"]
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="shared.css"/>
</head>
<body class="bg-background font-body flex min-h-screen">
    <div id="sidebar-overlay"></div>
    <aside id="sidebar" class="w-[280px] bg-surface-container-lowest border-r border-outline-variant/20 flex flex-col h-screen sticky top-0 shrink-0 hidden md:flex z-40 overflow-y-auto"></aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header id="topbar" data-title="Activities Management" class="h-16 bg-surface border-b border-outline-variant/20 shadow-sm flex items-center justify-between px-6 sticky top-0 z-30 shrink-0"></header>
        
        <main class="flex-1 p-6 lg:p-8 overflow-y-auto bg-background">
            <!-- Page Header -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                <div>
                    <h2 class="text-2xl font-headline font-bold text-on-surface">Student Activities</h2>
                    <p class="text-on-surface-variant mt-1 text-sm">Manage student houses, sports leagues, events, and extracurricular activities.</p>
                </div>
                <div class="flex gap-3">
                    <button class="btn-primary" onclick="window.location='add-activity.html'">
                        <span class="material-symbols-outlined text-[18px]">add_box</span>
                        Add Activity
                    </button>
                </div>
            </div>

            <!-- Activities Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" id="activities-container">
                <!-- Skeleton Loader -->
                <div class="col-span-full py-12 text-center text-on-surface-variant">
                    <span class="material-symbols-outlined animate-spin text-[32px]">sync</span>
                    <p class="mt-2 text-sm">Loading activities...</p>
                </div>
            </div>
        </main>
    </div>
    <script src="shared.js"></script>
    <script>
        const categoryColors = {
            'School Houses': { bg: 'bg-amber-100 dark:bg-amber-950/40', text: 'text-amber-700 dark:text-amber-400' },
            'Sports': { bg: 'bg-emerald-100 dark:bg-emerald-950/40', text: 'text-emerald-700 dark:text-emerald-400' },
            'Events': { bg: 'bg-purple-100 dark:bg-purple-950/40', text: 'text-purple-700 dark:text-purple-400' },
            'Extra Curricular Activities': { bg: 'bg-blue-100 dark:bg-blue-950/40', text: 'text-blue-700 dark:text-blue-400' }
        };

        const DEFAULT_IMAGE = 'https://images.unsplash.com/photo-1588072432836-e10032774350?auto=format&fit=crop&q=80&w=800';

        async function loadActivities() {
            try {
                const res = await fetch('/api/activities');
                if (!res.ok) throw new Error('Failed to load activities');
                const activities = await res.json();
                renderActivities(activities);
            } catch (e) {
                console.error(e);
                document.getElementById('activities-container').innerHTML = `
                    <div class="col-span-full py-12 text-center text-error">
                        <span class="material-symbols-outlined text-[48px]">error</span>
                        <p class="mt-2 font-bold">Error loading activities</p>
                    </div>
                `;
            }
        }

        function renderActivities(activities) {
            const container = document.getElementById('activities-container');
            const addCard = `
                <div class="card overflow-hidden group border-dashed border-2 flex items-center justify-center p-8 bg-surface-container-low hover:bg-surface-container-high transition-colors cursor-pointer min-h-[350px]" onclick="window.location='add-activity.html'">
                    <div class="text-center">
                        <div class="w-12 h-12 rounded-full bg-primary/10 text-primary flex items-center justify-center mx-auto mb-3">
                            <span class="material-symbols-outlined text-[28px]">add</span>
                        </div>
                        <p class="font-bold text-on-surface">Add New Activity</p>
                        <p class="text-xs text-on-surface-variant mt-1">Create a new activity card</p>
                    </div>
                </div>
            `;

            if (activities.length === 0) {
                container.innerHTML = addCard;
                return;
            }

            container.innerHTML = activities.map(act => {
                const colors = categoryColors[act.category] || { bg: 'bg-primary/10', text: 'text-primary' };
                const img = act.image ? resolveImageUrl(act.image) : DEFAULT_IMAGE;
                return `
                    <div class="card overflow-hidden group flex flex-col justify-between h-[420px]">
                        <div>
                            <div class="relative h-44 overflow-hidden bg-surface-container-high">
                                <img src="${img}" alt="${act.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='${DEFAULT_IMAGE}'"/>
                                <div class="absolute top-3 right-3">
                                    <span class="px-2.5 py-1 text-xs font-bold rounded-full ${colors.bg} ${colors.text}">
                                        ${act.category}
                                    </span>
                                </div>
                            </div>
                            <div class="p-5 flex-1">
                                <h3 class="font-bold text-lg text-on-surface line-clamp-1 mb-2" title="${act.title}">${act.title}</h3>
                                <p class="text-xs text-on-surface-variant line-clamp-3 leading-relaxed">${act.description || 'No description provided.'}</p>
                            </div>
                        </div>
                        <div class="p-5 pt-0">
                            <div class="flex gap-2 border-t border-outline-variant/20 pt-4">
                                <button class="flex-1 py-2 text-xs font-bold border border-outline-variant/50 rounded-lg hover:bg-surface-container transition-colors" onclick="editActivity('${act._id}')">Edit</button>
                                <button class="px-3 py-2 text-xs font-bold text-error border border-error/20 rounded-lg hover:bg-error/5 transition-colors" onclick="deleteActivity('${act._id}')">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('') + addCard;
        }

        function editActivity(id) {
            window.location.href = `add-activity.html?edit=${id}`;
        }

        async function deleteActivity(id) {
            if (!confirm('Are you sure you want to delete this activity?')) return;
            try {
                const res = await fetch(`/api/activities/${id}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    loadActivities();
                } else {
                    const err = await res.json();
                    alert(err.message || 'Failed to delete activity');
                }
            } catch (e) {
                console.error(e);
                alert('An error occurred while deleting the activity.');
            }
        }

        window.addEventListener('DOMContentLoaded', loadActivities);
    </script>
</body>
</html>
