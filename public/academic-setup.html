<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Academic Setup - Qurtaba School of Excellence Bela</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3525cd",
                        "on-primary": "#ffffff",
                        "surface": "#fcf8ff",
                        "surface-container": "#f0ecf9",
                        "surface-container-low": "#f5f2ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#eae6f4",
                        "on-surface": "#1b1b24",
                        "on-surface-variant": "#464555",
                        "background": "#fcf8ff",
                        "outline": "#777587",
                        "outline-variant": "#c7c4d8",
                        "error": "#ba1a1a"
                    },
                    fontFamily: { headline: ["Inter"], body: ["Inter"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="shared.css"/>
</head>
<body class="bg-background font-body flex min-h-screen">
    <div id="sidebar-overlay"></div>
    <aside id="sidebar" class="w-[280px] bg-surface-container-lowest border-r border-outline-variant/20 flex flex-col h-screen sticky top-0 shrink-0 hidden md:flex z-40 overflow-y-auto"></aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header id="topbar" data-title="Academic Setup" class="h-16 bg-surface border-b border-outline-variant/20 shadow-sm flex items-center justify-between px-6 sticky top-0 z-30 shrink-0"></header>
        
        <main class="flex-1 p-6 lg:p-8 overflow-y-auto bg-background">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                <div>
                    <h2 class="text-2xl font-headline font-bold text-on-surface">Academic Configuration</h2>
                    <p class="text-on-surface-variant mt-1 text-sm">Configure classes, sections, subjects, and academic years.</p>
                </div>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">
                <!-- Classes & Sections -->
                <div class="card overflow-hidden">
                    <div class="card-header flex justify-between items-center">
                        <h3 class="font-bold text-on-surface">Manage Classes</h3>
                        <button class="btn-primary py-1.5 px-4 text-xs" onclick="window.location='add-class.html'">Add Class</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Class Name</th>
                                    <th>Sections</th>
                                    <th>Students</th>
                                    <th class="text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody class="text-sm" id="classes-tbody">
                                <!-- Data will be loaded dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Subjects -->
                <div class="card overflow-hidden">
                    <div class="card-header flex justify-between items-center">
                        <h3 class="font-bold text-on-surface">Subject Directory</h3>
                        <button class="btn-primary py-1.5 px-4 text-xs" onclick="window.location='add-subject.html'">Add Subject</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Subject Name</th>
                                    <th>Code</th>
                                    <th>Type</th>
                                    <th class="text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody class="text-sm" id="subjects-tbody">
                                <!-- Data will be loaded dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="shared.js"></script>
    <script>
        async function loadClasses() {
            try {
                const res = await fetch('/api/classes');
                const classes = await res.json();
                const tbody = document.getElementById('classes-tbody');
                
                if (classes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-on-surface-variant">No classes configured.</td></tr>';
                    return;
                }

                tbody.innerHTML = classes.map(c => {
                    return `
                        <tr>
                            <td class="font-bold">${c.name}</td>
                            <td>
                                <span class="px-2 py-0.5 bg-surface-container-high rounded text-[10px] font-bold">${c.section || 'N/A'}</span>
                            </td>
                            <td>${c.capacity || 0} Capacity</td>
                            <td class="text-right">
                                <button onclick="window.location='add-class.html?edit=${c._id}'" class="p-1.5 hover:bg-surface-container rounded text-primary" title="Edit"><span class="material-symbols-outlined text-[18px]">edit</span></button>
                                <button onclick="deleteClass('${c._id}')" class="p-1.5 hover:bg-rose-50 rounded text-rose-600 ml-1" title="Delete"><span class="material-symbols-outlined text-[18px]">delete</span></button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                console.error('Error loading classes:', e);
            }
        }

        async function deleteClass(id) {
            try {
                // Delete immediately without confirmation prompt, as explicitly requested
                await fetch(`/api/classes/${id}`, { method: 'DELETE' });
                loadClasses();
            } catch (e) {
                console.error('Error deleting class:', e);
            }
        }

        async function loadSubjects() {
            try {
                const res = await fetch('/api/subjects');
                const subjects = await res.json();
                const tbody = document.getElementById('subjects-tbody');
                
                if (subjects.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-on-surface-variant">No subjects configured.</td></tr>';
                    return;
                }

                tbody.innerHTML = subjects.map(s => {
                    let badgeClass = 'bg-surface-variant text-on-surface-variant';
                    if (s.type === 'Compulsory') badgeClass = 'bg-blue-50 text-blue-700';
                    else if (s.type === 'Vocational') badgeClass = 'bg-emerald-50 text-emerald-700';

                    return `
                        <tr>
                            <td class="font-bold">${s.name}</td>
                            <td class="text-xs font-mono text-on-surface-variant">${s.code}</td>
                            <td><span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${badgeClass}">${s.type}</span></td>
                            <td class="text-right">
                                <button onclick="window.location='add-subject.html?edit=${s._id}'" class="p-1.5 hover:bg-surface-container rounded text-primary" title="Edit"><span class="material-symbols-outlined text-[18px]">edit</span></button>
                                <button onclick="deleteSubject('${s._id}')" class="p-1.5 hover:bg-rose-50 rounded text-rose-600 ml-1" title="Delete"><span class="material-symbols-outlined text-[18px]">delete</span></button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (e) {
                console.error('Error loading subjects:', e);
            }
        }

        async function deleteSubject(id) {
            try {
                // Delete immediately without confirmation prompt, as explicitly requested
                await fetch(`/api/subjects/${id}`, { method: 'DELETE' });
                loadSubjects();
            } catch (e) {
                console.error('Error deleting subject:', e);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadClasses();
            loadSubjects();
        });
    </script>
</body>
</html>
