<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Add Subject - Qurtaba School of Excellence Bela</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3525cd",
                        "on-primary": "#ffffff",
                        "surface": "#fcf8ff",
                        "surface-container": "#f0ecf9",
                        "surface-container-low": "#f5f2ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#eae6f4",
                        "on-surface": "#1b1b24",
                        "on-surface-variant": "#464555",
                        "background": "#fcf8ff",
                        "outline": "#777587",
                        "outline-variant": "#c7c4d8",
                        "error": "#ba1a1a"
                    },
                    fontFamily: {
                        headline: ["Inter"],
                        body: ["Inter"]
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="shared.css"/>
</head>
<body class="bg-background font-body flex min-h-screen">
    <div id="sidebar-overlay"></div>
    <aside id="sidebar" class="w-[280px] bg-surface-container-lowest border-r border-outline-variant/20 flex flex-col h-screen sticky top-0 shrink-0 hidden md:flex z-40 overflow-y-auto"></aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header id="topbar" data-title="Add Subject" class="h-16 bg-surface border-b border-outline-variant/20 shadow-sm flex items-center justify-between px-6 sticky top-0 z-30 shrink-0"></header>
        
        <main class="flex-1 p-6 lg:p-8 overflow-y-auto bg-background">
            <div class="max-w-4xl mx-auto">
                <!-- Breadcrumbs -->
                <nav class="flex items-center gap-2 text-sm text-on-surface-variant mb-6">
                    <a href="dashboard.html" class="hover:text-primary transition-colors">Dashboard</a>
                    <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                    <a href="academic-setup.html" class="hover:text-primary transition-colors">Academic Setup</a>
                    <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                    <span class="text-on-surface font-semibold">Add Subject</span>
                </nav>

                <div class="flex items-center justify-between mb-8">
                    <div>
                        <h2 class="text-2xl font-headline font-bold text-on-surface" id="form-heading">Add New Subject</h2>
                        <p class="text-on-surface-variant mt-1 text-sm" id="form-subheading">Register a new subject in the curriculum.</p>
                    </div>
                </div>

                <div class="card p-8">
                    <form class="space-y-6" id="subject-form">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- Subject Name -->
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-on-surface">Subject Name <span class="text-error">*</span></label>
                                <input type="text" name="name" id="subject-name" placeholder="e.g. Mathematics" class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" required/>
                            </div>

                            <!-- Subject Code -->
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-on-surface">Subject Code <span class="text-error">*</span></label>
                                <input type="text" name="code" id="subject-code" placeholder="e.g. MATH-101" class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" required/>
                            </div>

                            <!-- Subject Type -->
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-on-surface">Subject Type <span class="text-error">*</span></label>
                                <select name="type" id="subject-type" class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" required>
                                    <option value="Compulsory">Compulsory</option>
                                    <option value="Elective">Elective</option>
                                    <option value="Vocational">Vocational</option>
                                </select>
                            </div>

                            <!-- Class -->
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-on-surface">Assign to Class</label>
                                <select name="class" id="subject-class" class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all">
                                    <option value="All Classes">All Classes</option>
                                </select>
                            </div>

                            <!-- Description -->
                            <div class="md:col-span-2 space-y-2">
                                <label class="text-sm font-bold text-on-surface">Description</label>
                                <textarea name="description" id="subject-description" rows="3" placeholder="Brief overview of the subject curriculum..." class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all resize-none"></textarea>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="flex items-center justify-end gap-4 pt-6 border-t border-outline-variant/20">
                            <button type="button" class="btn-secondary px-8" onclick="window.location='academic-setup.html'">Cancel</button>
                            <button type="submit" class="btn-primary px-8">Save Subject</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="shared.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('edit');

        async function loadClasses() {
            try {
                const res = await fetch('/api/classes');
                const classes = await res.json();
                const select = document.getElementById('subject-class');
                classes.forEach(c => {
                    const classLabel = c.section ? `${c.name}-${c.section}` : c.name;
                    const opt = document.createElement('option');
                    opt.value = classLabel;
                    opt.textContent = classLabel;
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error('Error loading classes:', e);
            }
        }

        async function loadSubjectData() {
            if (!editId) return;
            try {
                document.getElementById('form-heading').textContent = 'Edit Subject';
                document.getElementById('form-subheading').textContent = 'Update details of the subject.';
                
                const res = await fetch(`/api/subjects/${editId}`);
                const data = await res.json();
                
                document.getElementById('subject-name').value = data.name || '';
                document.getElementById('subject-code').value = data.code || '';
                document.getElementById('subject-type').value = data.type || 'Compulsory';
                document.getElementById('subject-class').value = data.class || 'All Classes';
                document.getElementById('subject-description').value = data.description || '';
            } catch (e) {
                console.error('Error loading subject details:', e);
            }
        }

        document.getElementById('subject-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const url = editId ? `/api/subjects/${editId}` : '/api/subjects';
                const method = editId ? 'PATCH' : 'POST';

                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    window.location.href = 'academic-setup.html';
                } else {
                    const err = await res.json();
                    alert(err.message || 'Error saving subject');
                }
            } catch (err) {
                console.error('Error submitting form:', err);
                alert('Network error, please try again.');
            }
        });

        window.addEventListener('DOMContentLoaded', async () => {
            await loadClasses();
            await loadSubjectData();
        });
    </script>
</body>
</html>
