<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Add Facility - Qurtaba School of Excellence Bela</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3525cd",
                        "on-primary": "#ffffff",
                        "surface": "#fcf8ff",
                        "surface-container": "#f0ecf9",
                        "surface-container-low": "#f5f2ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#eae6f4",
                        "on-surface": "#1b1b24",
                        "on-surface-variant": "#464555",
                        "background": "#fcf8ff",
                        "outline": "#777587",
                        "outline-variant": "#c7c4d8",
                        "error": "#ba1a1a"
                    },
                    fontFamily: {
                        headline: ["Inter"],
                        body: ["Inter"]
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="shared.css"/>
</head>
<body class="bg-background font-body flex min-h-screen">
    <div id="sidebar-overlay"></div>
    <aside id="sidebar" class="w-[280px] bg-surface-container-lowest border-r border-outline-variant/20 flex flex-col h-screen sticky top-0 shrink-0 hidden md:flex z-40 overflow-y-auto"></aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header id="topbar" data-title="Add Facility" class="h-16 bg-surface border-b border-outline-variant/20 shadow-sm flex items-center justify-between px-6 sticky top-0 z-30 shrink-0"></header>
        
        <main class="flex-1 p-6 lg:p-8 overflow-y-auto bg-background">
            <div class="max-w-4xl mx-auto">
                <!-- Breadcrumbs -->
                <nav class="flex items-center gap-2 text-sm text-on-surface-variant mb-6">
                    <a href="dashboard.html" class="hover:text-primary transition-colors">Dashboard</a>
                    <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                    <a href="facilities-list.html" class="hover:text-primary transition-colors">Gallery Management</a>
                    <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                    <span class="text-on-surface font-semibold">Add Facility</span>
                </nav>

                <div class="flex items-center justify-between mb-8">
                    <div>
                        <h2 class="text-2xl font-headline font-bold text-on-surface">Add New Facility / Gallery Item</h2>
                        <p class="text-on-surface-variant mt-1 text-sm">Every facility added here will automatically appear on the public Gallery page.</p>
                    </div>
                </div>

                <div class="card p-8">
                    <form class="space-y-6" onsubmit="event.preventDefault(); alert('Facility added successfully! It will now appear on the public website.'); window.location='facilities-list.html';">
                        <div class="grid grid-cols-1 gap-6">
                            <!-- Facility Title -->
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-on-surface">Facility Title <span class="text-error">*</span></label>
                                <input type="text" placeholder="e.g. Modern Physics Laboratory" class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" required/>
                            </div>

                            <!-- Description -->
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-on-surface">Description <span class="text-error">*</span></label>
                                <textarea rows="4" placeholder="Briefly describe the facility..." class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all resize-none" required></textarea>
                            </div>

                            <!-- Upload Image -->
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-on-surface">Upload Facility Image <span class="text-error">*</span></label>
                                <div class="border-2 border-dashed border-outline-variant/50 rounded-2xl p-12 flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container-high transition-colors cursor-pointer group">
                                    <span class="material-symbols-outlined text-[64px] text-outline group-hover:text-primary transition-colors">add_photo_alternate</span>
                                    <p class="mt-4 text-base text-on-surface font-bold">Choose an image</p>
                                    <p class="text-sm text-on-surface-variant mt-1">Recommended size: 1200 x 800 px</p>
                                    <input type="file" class="hidden" required/>
                                </div>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="flex items-center justify-end gap-4 pt-8 border-t border-outline-variant/20">
                            <button type="button" class="btn-secondary px-8" onclick="window.location='facilities-list.html'">Cancel</button>
                            <button type="submit" class="btn-primary px-8">Save Facility</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="shared.js"></script>
</body>
</html>
