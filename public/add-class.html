<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Add New Class - Qurtaba School of Excellence Bela</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3525cd",
                        "on-primary": "#ffffff",
                        "surface": "#fcf8ff",
                        "surface-container": "#f0ecf9",
                        "surface-container-low": "#f5f2ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#eae6f4",
                        "on-surface": "#1b1b24",
                        "on-surface-variant": "#464555",
                        "background": "#fcf8ff",
                        "outline": "#777587",
                        "outline-variant": "#c7c4d8",
                        "error": "#ba1a1a"
                    },
                    fontFamily: {
                        headline: ["Inter"],
                        body: ["Inter"]
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="shared.css"/>
</head>
<body class="bg-background font-body flex min-h-screen">
    <div id="sidebar-overlay"></div>
    <aside id="sidebar" class="w-[280px] bg-surface-container-lowest border-r border-outline-variant/20 flex flex-col h-screen sticky top-0 shrink-0 hidden md:flex z-40 overflow-y-auto"></aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header id="topbar" data-title="Add Class" class="h-16 bg-surface border-b border-outline-variant/20 shadow-sm flex items-center justify-between px-6 sticky top-0 z-30 shrink-0"></header>
        
        <main class="flex-1 p-6 lg:p-8 overflow-y-auto bg-background">
            <div class="max-w-4xl mx-auto">
                <!-- Breadcrumbs -->
                <nav class="flex items-center gap-2 text-sm text-on-surface-variant mb-6">
                    <a href="dashboard.html" class="hover:text-primary transition-colors">Dashboard</a>
                    <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                    <a href="academic-setup.html" class="hover:text-primary transition-colors">Academic Setup</a>
                    <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                    <span class="text-on-surface font-semibold">Add New Class</span>
                </nav>

                <div class="flex items-center justify-between mb-8">
                    <div>
                        <h2 class="text-2xl font-headline font-bold text-on-surface" id="form-heading">Register New Class</h2>
                        <p class="text-on-surface-variant mt-1 text-sm" id="form-subheading">Define a new class, section, and assign a class teacher.</p>
                    </div>
                </div>

                <div class="card p-8">
                    <form id="classForm" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- Class Name -->
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-on-surface">Class Name <span class="text-error">*</span></label>
                                <input type="text" name="name" id="class-name" placeholder="e.g. Grade 10" class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" required/>
                            </div>

                            <!-- Section -->
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-on-surface">Section <span class="text-error">*</span></label>
                                <input type="text" name="section" id="class-section" placeholder="e.g. Section A, Blue, Rose" class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" required/>
                            </div>

                            <!-- Teacher -->
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-on-surface">Class Teacher <span class="text-error">*</span></label>
                                <select name="teacher" id="class-teacher" class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" required>
                                    <option value="" disabled selected>Select Teacher</option>
                                    <!-- Dynamic data -->
                                </select>
                            </div>

                            <!-- Capacity -->
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-on-surface">Student Capacity <span class="text-error">*</span></label>
                                <input type="number" name="capacity" id="class-capacity" placeholder="e.g. 40" class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" required/>
                            </div>

                            <!-- Schedule -->
                            <div class="md:col-span-2 space-y-2">
                                <label class="text-sm font-bold text-on-surface">Class Schedule / Timing</label>
                                <input type="text" name="schedule" id="class-schedule" placeholder="e.g. Mon-Fri, 08:00 AM - 01:30 PM" class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all"/>
                            </div>

                            <!-- Description -->
                            <div class="md:col-span-2 space-y-2">
                                <label class="text-sm font-bold text-on-surface">Description</label>
                                <textarea name="description" id="class-description" rows="3" placeholder="Additional notes about the class..." class="w-full px-4 py-2.5 rounded-xl border border-outline-variant/50 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all resize-none"></textarea>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="flex items-center justify-end gap-4 pt-6 border-t border-outline-variant/20">
                            <button type="button" class="btn-secondary px-8" onclick="window.history.back()">Cancel</button>
                            <button type="submit" class="btn-primary px-8">Save Class</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="shared.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('edit');

        async function loadClassData() {
            if (!editId) return;
            try {
                document.getElementById('form-heading').textContent = 'Edit Class';
                document.getElementById('form-subheading').textContent = 'Update class, section, and teacher assignment.';
                
                const res = await fetch(`/api/classes/${editId}`);
                const data = await res.json();
                
                document.getElementById('class-name').value = data.name || '';
                document.getElementById('class-section').value = data.section || '';
                document.getElementById('class-teacher').value = data.teacher || '';
                document.getElementById('class-capacity').value = data.capacity || '';
                if (document.getElementById('class-schedule')) {
                    document.getElementById('class-schedule').value = data.schedule || '';
                }
                if (document.getElementById('class-description')) {
                    document.getElementById('class-description').value = data.description || '';
                }
            } catch (e) {
                console.error('Error loading class details:', e);
            }
        }

        async function loadTeachers() {
            try {
                const res = await fetch('/api/staff?department=Academic');
                const staff = await res.json();
                const select = document.getElementById('class-teacher');
                staff.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t.fullName;
                    opt.textContent = t.fullName;
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error('Error loading teachers:', e);
            }
        }

        document.getElementById('classForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.capacity = parseInt(data.capacity);

            try {
                const url = editId ? `/api/classes/${editId}` : '/api/classes';
                const method = editId ? 'PATCH' : 'POST';

                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    alert(editId ? 'Class updated successfully!' : 'Class added successfully!');
                    window.location.href = 'academic-setup.html';
                } else {
                    const error = await res.json();
                    alert(error.message || 'Failed to save class');
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred while saving the class.');
            }
        });

        window.addEventListener('DOMContentLoaded', async () => {
            await loadTeachers();
            await loadClassData();
        });
    </script>
</body>
</html>
