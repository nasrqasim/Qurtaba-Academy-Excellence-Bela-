<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Payroll History - Qurtaba School of Excellence Bela</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3525cd",
                        "on-primary": "#ffffff",
                        "surface": "#fcf8ff",
                        "surface-container": "#f0ecf9",
                        "surface-container-low": "#f5f2ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#eae6f4",
                        "on-surface": "#1b1b24",
                        "on-surface-variant": "#464555",
                        "background": "#fcf8ff",
                        "outline": "#777587",
                        "outline-variant": "#c7c4d8",
                        "error": "#ba1a1a"
                    },
                    fontFamily: {
                        headline: ["Inter"],
                        body: ["Inter"]
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="shared.css"/>
</head>
<body class="bg-background font-body flex min-h-screen">
    <div id="sidebar-overlay"></div>
    <aside id="sidebar" class="w-[280px] bg-surface-container-lowest border-r border-outline-variant/20 flex flex-col h-screen sticky top-0 shrink-0 hidden md:flex z-40 overflow-y-auto"></aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header id="topbar" data-title="Payroll History" class="h-16 bg-surface border-b border-outline-variant/20 shadow-sm flex items-center justify-between px-6 sticky top-0 z-30 shrink-0"></header>
        
        <main class="flex-1 p-6 lg:p-8 overflow-y-auto bg-background">
            <!-- Page Header -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                <div>
                    <h2 class="text-2xl font-headline font-bold text-on-surface">Payroll History</h2>
                    <p class="text-on-surface-variant mt-1 text-sm">View and track past salary payments and records.</p>
                </div>
                <div class="flex gap-3">
                    <button class="btn-primary" onclick="window.location='process-month.html'">
                        <span class="material-symbols-outlined text-[18px]">account_balance</span>
                        Process Month
                    </button>
                </div>
            </div>

            <!-- Filters -->
            <div class="card p-4 mb-8">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">search</span>
                        <input type="text" placeholder="Search employee..." class="w-full pl-10 pr-4 py-2 bg-surface-container-low border border-outline-variant/50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-primary/20 transition-all"/>
                    </div>
                    <select class="px-4 py-2 bg-surface-container-low border border-outline-variant/50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-primary/20 transition-all">
                        <option>All Months</option>
                        <option>October 2024</option>
                        <option>September 2024</option>
                        <option>August 2024</option>
                    </select>
                    <select class="px-4 py-2 bg-surface-container-low border border-outline-variant/50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-primary/20 transition-all">
                        <option>All Status</option>
                        <option>Paid</option>
                        <option>Pending</option>
                    </select>
                    <button class="btn-secondary">
                        <span class="material-symbols-outlined text-[18px]">filter_alt</span>
                        Apply Filters
                    </button>
                </div>
            </div>

            <!-- History Table -->
            <div class="card overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Employee Name</th>
                                <th>Month</th>
                                <th>Basic Salary</th>
                                <th>Bonus</th>
                                <th>Deductions</th>
                                <th>Net Pay</th>
                                <th>Payment Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody class="text-sm" id="payroll-history-tbody">
                            <!-- Dynamic data -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="shared.js"></script>
    <script>
        async function loadPayrollHistory() {
            try {
                const res = await fetch('/api/payroll');
                const payrolls = await res.json();
                const tbody = document.getElementById('payroll-history-tbody');
                
                if (payrolls.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" class="text-center py-6 text-on-surface-variant">No payroll history found.</td></tr>';
                    return;
                }

                tbody.innerHTML = payrolls.map(p => {
                    const statusClass = p.status === 'Paid' ? 'badge-success' : 'badge-warning';
                    const paymentDateStr = p.paymentDate ? new Date(p.paymentDate).toLocaleDateString() : '-';
                    return `
                    <tr>
                        <td class="font-bold">${p.employeeName}</td>
                        <td>${p.month}</td>
                        <td>₨ ${(p.basicSalary || 0).toLocaleString()}</td>
                        <td>₨ ${(p.bonus || 0).toLocaleString()}</td>
                        <td class="text-rose-600">₨ ${(p.deductions || 0).toLocaleString()}</td>
                        <td class="font-bold text-primary">₨ ${(p.netPay || 0).toLocaleString()}</td>
                        <td>${paymentDateStr}</td>
                        <td><span class="${statusClass}">${p.status}</span></td>
                        <td>
                            <div class="flex gap-2">
                                ${p.status === 'Pending' ? `<button onclick="approveSalary('${p._id}')" class="p-1 hover:bg-emerald-50 rounded text-emerald-600 font-bold text-xs">Approve</button>` : ''}
                                <button onclick="deletePayroll('${p._id}')" class="p-1 hover:bg-rose-50 rounded text-rose-600" title="Delete"><span class="material-symbols-outlined text-[18px]">delete</span></button>
                            </div>
                        </td>
                    </tr>
                    `;
                }).join('');
            } catch (e) {
                console.error(e);
            }
        }

        async function approveSalary(id) {
            try {
                const res = await fetch(`/api/payroll/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'Paid', paymentDate: new Date() })
                });
                if (res.ok) {
                    alert('Salary approved and marked as Paid!');
                    loadPayrollHistory();
                } else {
                    alert('Failed to approve salary payment');
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function deletePayroll(id) {
            if (!confirm('Are you sure you want to delete this payroll record?')) return;
            try {
                const res = await fetch(`/api/payroll/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadPayrollHistory();
                } else {
                    alert('Failed to delete payroll record');
                }
            } catch (e) {
                console.error(e);
            }
        }

        window.addEventListener('DOMContentLoaded', loadPayrollHistory);
    </script>
</body>
</html>
