<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Payroll Management - Qurtaba School of Excellence Bela</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3525cd",
                        "on-primary": "#ffffff",
                        "surface": "#fcf8ff",
                        "surface-container": "#f0ecf9",
                        "surface-container-low": "#f5f2ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#eae6f4",
                        "on-surface": "#1b1b24",
                        "on-surface-variant": "#464555",
                        "background": "#fcf8ff",
                        "outline": "#777587",
                        "outline-variant": "#c7c4d8",
                        "error": "#ba1a1a"
                    },
                    fontFamily: { headline: ["Inter"], body: ["Inter"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="shared.css"/>
</head>
<body class="bg-background font-body flex min-h-screen">
    <div id="sidebar-overlay"></div>
    <aside id="sidebar" class="w-[280px] bg-surface-container-lowest border-r border-outline-variant/20 flex flex-col h-screen sticky top-0 shrink-0 hidden md:flex z-40 overflow-y-auto"></aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header id="topbar" data-title="Payroll & Salary" class="h-16 bg-surface border-b border-outline-variant/20 shadow-sm flex items-center justify-between px-6 sticky top-0 z-30 shrink-0"></header>
        
        <main class="flex-1 p-6 lg:p-8 overflow-y-auto bg-background">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                <div>
                    <h2 class="text-2xl font-headline font-bold text-on-surface">Payroll Disbursement</h2>
                    <p class="text-on-surface-variant mt-1 text-sm">Generate payslips, manage deductions, and track staff salaries.</p>
                </div>
                <div class="flex gap-3">
                    <button class="btn-secondary">
                        <span class="material-symbols-outlined text-[18px]">history</span>
                        Payroll History
                    </button>
                    <button class="btn-primary">
                        <span class="material-symbols-outlined text-[18px]">payments</span>
                        Process Month
                    </button>
                </div>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="card p-6 border-l-4 border-l-primary">
                    <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest mb-1">Total Monthly Liability</p>
                    <p class="text-3xl font-black text-on-surface" id="total-liability">₨ 0</p>
                    <p class="text-xs text-on-surface-variant mt-2 font-medium">For Current Month</p>
                </div>
                <div class="card p-6 border-l-4 border-l-emerald-500">
                    <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest mb-1">Disbursed</p>
                    <p class="text-3xl font-black text-on-surface">₨ 2.10M</p>
                    <p class="text-xs text-emerald-600 mt-2 font-bold">85.7% Complete</p>
                </div>
                <div class="card p-6 border-l-4 border-l-amber-500">
                    <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest mb-1">Remaining</p>
                    <p class="text-3xl font-black text-on-surface">₨ 350k</p>
                    <p class="text-xs text-amber-600 mt-2 font-bold">Pending Approval</p>
                </div>
            </div>

            <!-- Payroll Table -->
            <div class="card overflow-hidden">
                <div class="card-header flex justify-between items-center bg-surface-container-low/20">
                    <h3 class="font-bold text-on-surface">Employee Salary List</h3>
                    <div class="flex gap-2">
                        <button class="px-3 py-1.5 bg-surface-container rounded-lg text-xs font-bold text-primary">Bulk Print Payslips</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Employee</th>
                                <th>Base Salary</th>
                                <th>Allowances</th>
                                <th>Deductions</th>
                                <th>Net Salary</th>
                                <th>Status</th>
                                <th class="text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="payroll-tbody" class="text-sm">
                            <!-- Dynamically loaded -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="shared.js"></script>
    <script>
        async function loadPayroll() {
            try {
                const res = await fetch('/api/staff');
                const staffList = await res.json();
                
                let totalLiability = 0;
                
                const tbody = document.getElementById('payroll-tbody');
                tbody.innerHTML = staffList.map(staff => {
                    totalLiability += (staff.salary || 0);
                    const initials = staff.fullName.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
                    
                    return `
                    <tr>
                        <td>
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold text-xs">${initials}</div>
                                <div>
                                    <p class="font-bold">${staff.fullName}</p>
                                    <p class="text-[10px] text-on-surface-variant font-medium">${staff.designation}</p>
                                </div>
                            </div>
                        </td>
                        <td>₨ ${(staff.salary || 0).toLocaleString()}</td>
                        <td>₨ 0</td>
                        <td class="text-rose-600">₨ 0</td>
                        <td class="font-black">₨ ${(staff.salary || 0).toLocaleString()}</td>
                        <td><span class="badge-warning px-2 py-0.5 rounded text-[10px] font-bold uppercase">Pending</span></td>
                        <td class="text-right">
                            <button class="p-1.5 hover:bg-surface-container rounded text-primary" title="Generate Payslip"><span class="material-symbols-outlined text-[18px]">description</span></button>
                        </td>
                    </tr>`;
                }).join('');
                
                document.getElementById('total-liability').textContent = `₨ ${totalLiability.toLocaleString()}`;
            } catch (e) {
                console.error(e);
            }
        }

        window.addEventListener('DOMContentLoaded', loadPayroll);
    </script>
</body>
</html>
